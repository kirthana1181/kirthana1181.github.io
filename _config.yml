title: Kirthana
description: >-
  ECE Student specializing in VLSI Design, 
  AI-ML and Embedded Systems. Passionate about hardware-software co-design, AI Hardware, 
  and sustainable manufacturing. love to innovate!🛠️💡
  
remote_theme: mmistakes/minimal-mistakes
# Build settings
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-include-cache

minimal_mistakes_skin: "default"
# Site Settings
author:
  name: "Kirthana P Rao"
  bio: "ECE Student | VLSI | AI-ML | Embedded Systems"
  avatar: "/assets/images/profile.jpg"
  links:
  - label: "GitHub"
    icon: "fab fa-fw fa-github"
    url: "https://github.com/kirthana1181"
  - label: "LinkedIn"
    icon: "fab fa-fw fa-linkedin"
    url: "https://www.linkedin.com/in/kirthana-p-6b89b326b"
  - label: "Email"
    icon: "fas fa-fw fa-envelope"
    url: "mailto: work.kirthana@gmail.com"
  
baseurl: "" # Leave empty for username.github.io https://www.kirthanar1181.github.com
url: "https://kirthana1181.github.io" # Replace with your actual GitHub username

# Navigation
header_pages:
  - about.md
  - projects.md
  - skills.md

# Collections for organizing content
collections:
  projects:
    output: true
    permalink: /projects/:name/
  certifications:
    output: false

# Defaults
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
