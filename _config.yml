title: Kirthana
description: >-
  ECE Student specializing in VLSI Design, 
  AI-ML and Embedded Systems. Passionate about hardware-software co-design, AI Hardware, 
  and sustainable manufacturing. love to innovate!🛠️💡

# Site Settings
author:
  name: "Kirthana P Rao"
  bio: "ECE Student | VLSI | AI-ML | Embedded Systems"
  avatar: "/assets/images/profile.jpg"
  
baseurl: "https://www.kirthanar1181.github.com" # Leave empty for username.github.io
url: "https://kirthana1181.github.io" # Replace with your actual GitHub username

# Social Links
minima:
social_links:
    - { platform: github,   user_url: "https://github.com/kirthana1181" }
    - { platform: linkedin, user_url: "https://www.linkedin.com/in/kirthana-p-6b89b326b" }
    - { platform: email,    user_url: "mailto:work.kirthana@gmail.com" }


theme: minima
# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-include-cache

minima: "default"

# Navigation
header_pages:
  - about.md
  - projects.md
  - experience.md
  - skills.md
  - contact.md

# Collections for organizing content
collections:
  projects:
    output: true
    permalink: /projects/:name/
  certifications:
    output: false

# Defaults
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
