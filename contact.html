<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Kirthana P Rao</title>
  <style>
    :root {
      --primary: #667eea;
      --secondary: #764ba2;
      --text: #333;
      --muted: #666;
      --surface: #f8f9fa;
      --border: #e5e7eb;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .top-nav {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      padding: 1rem;
      background: #f8f9fa;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .top-nav a {
      display: inline-block;
      padding: 0.6rem 1.2rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      text-decoration: none;
      border-radius: 25px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .top-nav a:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.35);
    }

    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      text-align: center;
      padding: 2.5rem 2rem;
    }

    .header h1 {
      font-size: 2.4rem;
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 1.05rem;
      opacity: 0.95;
    }

    .form-section {
      padding: 2rem;
      background: white;
    }

    .contact-form {
      display: grid;
      gap: 1.25rem;
    }

    .form-group {
      display: grid;
      gap: 0.45rem;
    }

    label {
      font-weight: 600;
      color: #222;
    }

    input,
    textarea {
      width: 100%;
      padding: 0.95rem 1rem;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.14);
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    .submit-btn {
      justify-self: start;
      padding: 0.9rem 1.6rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.28);
    }

    .note {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .header {
        padding: 2rem 1.25rem;
      }

      .header h1 {
        font-size: 2rem;
      }

      .form-section {
        padding: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a href="/">Home</a>
      <a href="/projects">Projects</a>
      <a href="/skills">Skills</a>
    </div>

    <div class="header">
      <h1>Contact Me</h1>
      <p>Let's get in touch!</p>
    </div>

    <div class="form-section">
      <form class="contact-form" action="https://formspree.io/f/mnjegnoa" method="POST">
        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="Enter your email address" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Write your message here" required></textarea>
        </div>

        <button class="submit-btn" type="submit">Send Message</button>
      </form>
<!-- 
      <p class="note">
        Replace <strong>YOUR_FORMSPREE_URL</strong> with your actual Formspree endpoint before publishing.
      </p> -->
    </div>
  </div>
</body>
</html>
